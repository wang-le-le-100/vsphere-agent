[project]
name = "vsphere-agent"
version = "0.1.0"
description = "vSphere events, tasks and alarms collector"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pyvmomi>=8,<9",
    "elasticsearch>=8.14,<9",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
