# 仅供示例，所有主机、账户和 Data Stream 都是虚构的；不可直接用于生产。
# 生产配置应由用户创建并限制文件读取权限，不要将真实凭据提交到 Git。
vcenter:
  host: vcenter.example.invalid
  port: 443
  username: example-user
  password: replace-vcenter-password
  request_timeout: 120
  verify_ssl: true
  # 如使用私有 CA，请指定 CA 证书文件：
  # ca_file: /etc/vsphere-agent/vcenter-ca.pem
elasticsearch:
  hosts:
    - https://es1.example.invalid:9200
  # 如使用私有 CA，请指定 CA 证书文件：
  # ca_file: /etc/vsphere-agent/elasticsearch-ca.pem
  username: example-user
  password: replace-es-password
  request_timeout: 10
  max_retries: 2
  retry_delays: [1, 2]
  probe_interval: 30
streams:
  event: logs-example.events-test
  task: logs-example.tasks-test
  alarm: logs-example.alarms-test
  diagnostic: logs-example.agent-test
collection:
  events_interval: 30
  tasks_interval: 30
  alarms_interval: 300
  page_size: 500
  task_wait_timeout: 10
buffer:
  max_items: 5000
  max_bytes: 10485760
  max_batch_items: 500
  max_batch_bytes: 5242880
  flush_interval: 5
state:
  path: /var/lib/vsphere-agent/state.sqlite
  event_max_keys: 100000
  event_ttl: 86400
  alarm_max_keys: 100000
  max_bytes: 33554432
